name: App build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      OS: ${{ matrix.config.name }}
      MSVC_VERSION: C:/Program Files/Microsoft Visual Studio/2022/Enterprise
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "win64", os: windows-latest }
          - { name: "win32", os: windows-latest }
          - { name: "linux", os: ubuntu-22.04 }
          # - { name: "macos", os: macos-latest }
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb* gcc-10 g++-10
          echo "QMAKE_FLAGS=QMAKE_CXX=g++-10 QMAKE_CC=gcc-10 QMAKE_LINK=g++-10" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ env.OS }}-${{ hashFiles('./share/ci/*.py') }}

      - name: Build and Package
        shell: bash
        run: |
          python ./share/ci/release.py
          echo "artifact=$(python ./share/ci/release.py artifact_name)" >> $GITHUB_ENV

      - name: Upload build artifact
        if: env.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ./${{ env.artifact }}

      - name: Publish Release Asset (on Tag)
        if: startsWith(github.ref, 'refs/tags/') && env.artifact != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ env.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
