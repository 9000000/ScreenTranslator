name: App build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - '[0-9]+.*'
  pull_request:
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Tên/số phiên bản tùy chỉnh (ví dụ: v4.1.1 hoặc 4.1.0-custom)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      OS: ${{ matrix.config.name }}
      VERSION: ${{ github.event.inputs.custom_version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "win64", os: windows-latest, arch: "x64" }
          - { name: "linux", os: ubuntu-22.04 }
          # - { name: "macos", os: macos-latest }
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip aqtinstall

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.arch }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb* gcc-10 g++-10
          echo "QMAKE_FLAGS=QMAKE_CXX=g++-10 QMAKE_CC=gcc-10 QMAKE_LINK=g++-10" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ env.OS }}-${{ hashFiles('./share/ci/*.py') }}

      - name: Build and Package
        run: python ./share/ci/release.py

      - name: Upload build artifact
        if: env.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ./${{ env.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Determine Version and Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            TAG="${{ github.event.inputs.custom_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            PRO_VER=$(grep -E 'VER\s*=' screen-translator.pro | sed -E 's/.*VER\s*=\s*//' | tr -d ' \r\n')
            [ -z "$PRO_VER" ] && PRO_VER="4.1.0"
            TAG="v${PRO_VER}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "release_name=ScreenTranslator ${TAG}" >> $GITHUB_OUTPUT

      - name: List Artifacts
        run: ls -la ./artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.release_name }}
          files: ./artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}