name: App build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - '[0-9]+.*'
  pull_request:
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Tên/số phiên bản tùy chỉnh (ví dụ: v4.1.1 hoặc 4.2.0-custom)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      OS: ${{ matrix.config.name }}
      VERSION: ${{ github.event.inputs.custom_version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "win64", os: windows-latest, arch: "x64" }
          - { name: "linux", os: ubuntu-22.04 }
          # - { name: "macos", os: macos-latest }
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip aqtinstall

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.arch }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb* gcc-10 g++-10
          echo "QMAKE_FLAGS=QMAKE_CXX=g++-10 QMAKE_CC=gcc-10 QMAKE_LINK=g++-10" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ env.OS }}-${{ hashFiles('./share/ci/*.py') }}

      - name: Build and Package
        run: python ./share/ci/release.py

      - name: Upload build artifact
        if: env.artifact != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.artifact }}
          path: ./${{ env.artifact }}

      - name: Upload build metadata
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: meta-${{ matrix.config.name }}
          path: ./${{ matrix.config.name }}-meta.json
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts
          pattern: ScreenTranslator-*
          merge-multiple: true

      - name: Download build metadata
        uses: actions/download-artifact@v7
        with:
          path: ./meta
          pattern: meta-*
          merge-multiple: true

      - name: Determine Version and Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            TAG="${{ github.event.inputs.custom_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            PRO_VER=$(grep -E 'VER\s*=' screen-translator.pro | sed -E 's/.*VER\s*=\s*//' | tr -d ' \r\n')
            [ -z "$PRO_VER" ] && PRO_VER="4.2.0"
            TAG="v${PRO_VER}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "release_name=ScreenTranslator ${TAG}" >> $GITHUB_OUTPUT

      - name: List Artifacts
        run: ls -la ./artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.vars.outputs.release_name }}
          files: ./artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update updates.json with release metadata
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import glob, json, os

          tag = os.environ['TAG']
          repo = os.environ['REPO']
          with open('updates.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          changed = False
          for meta_file in sorted(glob.glob('./meta/*-meta.json')):
              with open(meta_file, 'r', encoding='utf-8') as f:
                  meta = json.load(f)
              host = meta.get('host')
              if not host or host not in data.get('app', {}):
                  continue
              entry = data['app'][host]
              entry['version'] = meta['version']
              if entry.get('files'):
                  finfo = entry['files'][0]
                  finfo['url'] = f"https://github.com/{repo}/releases/download/{tag}/{meta['artifact']}"
                  if meta.get('md5'):
                      finfo['md5'] = meta['md5']
                  if meta.get('size'):
                      finfo['size'] = meta['size']
                  changed = True

          if changed:
              with open('updates.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write('\n')
          EOF
          if ! git diff --quiet updates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add updates.json
            git commit -m "chore: update updates.json for ${TAG} [skip ci]"
            git push origin HEAD:master
          fi